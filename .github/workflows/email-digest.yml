name: Email Digest

on:
  schedule:
    - cron: "0 12 * * *"   # daily, 8am ET; only sends when something's new
  # Also run straight after a search finishes. The scheduled pair (search 11:00,
  # digest 12:00) works on its own, but only on the schedule -- a manual search
  # run produced no email until the next day, which made the whole pipeline
  # impossible to test in one go. Now one "Run workflow" on Search Listings
  # produces the search AND the digest.
  workflow_run:
    workflows: ["Search Listings"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Send even with no new houses (announces the criteria)"
        type: boolean
        default: false
      preview_to:
        description: "Send ONLY to this address (a test). Blank = the normal recipients."
        type: string
        default: ""
      markets:
        description: "With preview_to: which markets, e.g. Orange County, Los Angeles. Blank = Atlanta."
        type: string
        default: ""
      dry_run:
        description: "Render the emails as a downloadable artifact and send nothing"
        type: boolean
        default: false
      days:
        description: "Include houses added in the last N days (default 1)"
        type: string
        default: "1"

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send digest
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ inputs.preview_to || secrets.EMAIL_TO }}
          DIGEST_MARKETS: ${{ inputs.markets }}
          DIGEST_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          DIGEST_OUT: ${{ runner.temp }}/digest-preview
          FORCE_SEND: ${{ inputs.force && '1' || '0' }}
          DIGEST_DAYS: ${{ inputs.days || '1' }}
          # The multifamily digest owns those listings; this email must not
          # repeat them, or every complex arrives twice each morning.
          DIGEST_EXCLUDE: Multifamily
          # Optional. When set, each card leads with a Street View curb photo.
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: python send_digest.py
      - name: Upload rendered emails (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: homes-email-preview
          path: ${{ runner.temp }}/digest-preview
