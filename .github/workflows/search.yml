name: Search Listings

# ONCE A DAY. This schedule is the spend rate: RentCast bills per request and
# takes one zip code per request, so a full pass over the current Active
# criteria costs ~19 requests (~$3.80). At the previous every-6-hours cadence
# that was ~76 requests/day, which drains a $100 balance in under a week.
# Do not raise the frequency without re-checking scripts/rentcast_budget.py.
on:
  schedule:
    # Mon/Wed/Fri ~7am Atlanta, an hour before the 8am digest so each search's
    # results land in that morning's email. ~9 requests per pass, ~117 a month:
    # the free 50 cover the first runs, then ~$13-14/month of prepaid credit --
    # a cadence and cost the owner approved on 2026-08-28. MONTHLY_CALL_CAP in
    # scripts/rentcast_budget.py hard-stops the month at 120 calls no matter
    # what, so this schedule cannot outspend that approval.
    - cron: "0 11 * * 1,3,5"
  workflow_dispatch:
    inputs:
      allow_paid:
        description: "Spend prepaid credit if the free monthly allowance is used up (costs money)"
        type: boolean
        default: false

# One run at a time. Concurrent runs would each spend against the budget and
# race on the counter commit, so the recorded spend would understate reality.
concurrency:
  group: search-listings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run search
        working-directory: scripts
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          LISTINGS_API_TYPE: ${{ vars.LISTINGS_API_TYPE }}
          LISTINGS_API_URL: ${{ secrets.LISTINGS_API_URL }}
          LISTINGS_API_KEY: ${{ secrets.LISTINGS_API_KEY }}
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
          # On the schedule this is deliberately ON: the owner approved the
          # Mon/Wed/Fri cadence knowing it runs ~$13-14/month past the free
          # allowance. MONTHLY_CALL_CAP (120) in rentcast_budget.py is the
          # hard ceiling that keeps that approval from ever being exceeded.
          ALLOW_PAID_CREDIT: ${{ github.event_name == 'schedule' && '1' || (inputs.allow_paid && '1' || '0') }}
        run: python search_worker.py
      - name: Commit RentCast spend counter
        # The runner is ephemeral, so an uncommitted counter means the next run
        # starts from zero and the ceiling never binds. This must run even if
        # the search step failed -- the calls were still billed.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rentcast_budget.json
          git diff --cached --quiet || git commit -m "RentCast spend counter"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
