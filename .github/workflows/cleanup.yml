# Removes houses the current rules would never have written. Airtable only --
# no listing API calls, so this costs nothing.
name: Clean Up Houses

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be removed without deleting anything"
        type: boolean
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean up
        working-directory: scripts
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          # Both backends are wired up; scripts/db.py picks one.
          # Unset, it stays on Airtable, so this is inert until the
          # Supabase secrets exist and DB_BACKEND says so.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DB_BACKEND: ${{ vars.DB_BACKEND }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python cleanup_houses.py
