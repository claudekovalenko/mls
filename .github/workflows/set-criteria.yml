# Edit a Search Criteria row without opening Airtable.
# Airtable only -- no listing API calls, so this costs nothing.
name: Set Criteria

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Row name (partial is fine if unambiguous)"
        type: string
        required: true
      fields:
        description: 'JSON, e.g. {"Zip Codes": "30068, 30062", "Active": true}'
        type: string
        required: true

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set fields
        working-directory: scripts
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          CRITERIA_NAME: ${{ inputs.name }}
          FIELDS: ${{ inputs.fields }}
        run: python set_criteria.py
