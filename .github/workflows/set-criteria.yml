# Edit a Search Criteria row without opening the database dashboard.
# Database only -- no listing API calls, so this costs nothing.
name: Set Criteria

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Row name (partial is fine if unambiguous)"
        type: string
        required: true
      fields:
        description: 'JSON, e.g. {"Zip Codes": "30068, 30062", "Active": true}'
        type: string
        required: true
      create:
        description: "Create the row if no exact match exists"
        type: boolean
        default: false

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set fields
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CRITERIA_NAME: ${{ inputs.name }}
          FIELDS: ${{ inputs.fields }}
          CREATE: ${{ inputs.create && '1' || '0' }}
        run: python set_criteria.py
