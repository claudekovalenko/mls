# On-demand scoring report. Prints to the run log; writes nothing to Airtable.
name: Listing Report

on:
  workflow_dispatch:
    inputs:
      allow_paid:
        description: "Spend prepaid credit if the free monthly allowance is used up (costs money)"
        type: boolean
        default: false

# The counter commit needs write access; without this the runner's token is
# read-only and the push 403s, losing the record of calls already billed.
permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Score listings
        working-directory: scripts
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          # Both backends are wired up; scripts/db.py picks one.
          # Unset, it stays on Airtable, so this is inert until the
          # Supabase secrets exist and DB_BACKEND says so.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DB_BACKEND: ${{ vars.DB_BACKEND }}
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
          ALLOW_PAID_CREDIT: ${{ inputs.allow_paid && '1' || '0' }}
        run: python report.py
      - name: Commit RentCast spend counter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rentcast_budget.json
          git diff --cached --quiet || git commit -m "RentCast spend counter"
          git pull --rebase --autostash origin main
          git push
