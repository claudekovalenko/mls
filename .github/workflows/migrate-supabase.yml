# Copy Airtable's contents into Supabase. Reads Airtable, writes Supabase,
# never modifies Airtable -- so a bad run costs nothing but a re-run.
# Idempotent: rows upsert on their natural key, so this can be run repeatedly
# to catch whatever the searches added since last time.
name: Migrate to Supabase

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be written without writing it"
        type: boolean
        default: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Migrate
        working-directory: scripts
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python migrate_to_supabase.py
