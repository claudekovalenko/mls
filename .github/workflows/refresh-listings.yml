name: Refresh Tracked Listing Details

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh listings
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: python scripts/refresh_listings.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add houses.json
          if [ -f rentcast_usage.json ]; then git add rentcast_usage.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Refresh tracked listing prices/photos"
            git push
          fi
